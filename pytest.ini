[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Integration tests need a live Postgres; unit tests do not. Marked so the unit
# suite can run anywhere:
#   py -m pytest -m "not integration"
markers =
    integration: requires a live Postgres (sephora_oltp + sephora_dw)
    dag: requires apache-airflow importable

# Show a one-line reason for every skip, so a skipped test is visibly skipped
# rather than silently absent from the count.
addopts = -ra --strict-markers
