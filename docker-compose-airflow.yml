# Airflow for this project, kept in its own compose file so the database can be
# started and stopped independently of the scheduler.
#
#   docker compose -f docker-compose.yml -f docker-compose-airflow.yml up -d
#   open http://localhost:8081   (8080 is taken by another stack on this machine)
#
# LocalExecutor rather than CeleryExecutor: no Redis, no workers, no Flower.
# This pipeline is a handful of tasks against one database, and the Celery
# services would be moving parts with nothing to do.
#
# Airflow's own metadata lives in a SEPARATE container from the project data.
# Sharing one Postgres between "the warehouse" and "the scheduler's bookkeeping"
# means a mistake in one can take out the other.

name: leapfrog-sephora

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_metadata/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow_apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Makes the etl/ package importable from the DAG
    PYTHONPATH: /opt/airflow/project
    # Connections defined here rather than clicked into the UI, so a fresh
    # container comes up already wired. Host is the compose service name, and
    # the port is the CONTAINER port 5432, not the host's 5434.
    AIRFLOW_CONN_SEPHORA_OLTP: 'postgresql://${OLTP_DB_USER:-postgres}:${OLTP_DB_PASSWORD:-postgres}@postgres:5432/${OLTP_DB_NAME:-sephora_oltp}'
    AIRFLOW_CONN_SEPHORA_DW: 'postgresql://${DW_DB_USER:-postgres}:${DW_DB_PASSWORD:-postgres}@postgres:5432/${DW_DB_NAME:-sephora_dw}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/project/etl
    - ./logs/airflow:/opt/airflow/logs
    - ./config:/opt/airflow/config
    # Mounted so tests/test_dag_structure.py can run where Airflow actually is.
    # It skips locally (airflow isn't in the host venv), and a test that only
    # ever skips proves nothing:
    #   docker exec leapfrog_airflow_scheduler python -m pytest \
    #     /opt/airflow/project/tests/test_dag_structure.py
    - ./tests:/opt/airflow/project/tests
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow_metadata:
      condition: service_healthy

services:
  airflow_metadata:
    image: postgres:16
    container_name: leapfrog_airflow_metadata
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  airflow_init:
    <<: *airflow-common
    container_name: leapfrog_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: on-failure

  airflow_apiserver:
    <<: *airflow-common
    container_name: leapfrog_airflow_apiserver
    command: api-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  airflow_scheduler:
    <<: *airflow-common
    container_name: leapfrog_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  airflow_dag_processor:
    <<: *airflow-common
    container_name: leapfrog_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow_init:
        condition: service_completed_successfully

volumes:
  airflow_metadata_data:
